{% extends 'parent/base.html' %}
{% block title %}
    delete_to-do-list
{% endblock %}

{% block content %}
    <form method="post" class="post-container">
        {% csrf_token %}
        <p class="title">are you sure?</p>
        <a href="{% url 'blog:to_do_list' %}" class="a">no</a>
        <input type="submit" value="yes" >
    </form>
{% endblock %}

{% block head %}
    <style>
        .post-redemption {
            max-height: 70vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            text-align: center;
            padding: 40px 20px;

        }

        .post-container {
            max-width: 120px;
            margin: 60px auto;
            padding: 35px;
            background: #141414;
            border-radius: 50px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.75);
        }

        /* عنوان */
        .post-container .title {
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 30px;
            color: #f2f2f2;
            letter-spacing: 0.5px;
        }

        /* پاراگراف‌های فرم Django */
        .post-container form p {
            margin-bottom: 15px;
        }

        .post-container .a {
            width: 100%;
            margin-top: 25px;
            padding: 12px 52px;
            background: linear-gradient(90deg, #2a2a2a, #3a3a3a);
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
        }

        /* لیبل‌ها */
        .post-container label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #cfcfcf;
        }

        /* ورودی‌ها */
        .post-container input[type="text"],
        .post-container input[type="email"],
        .post-container input[type="password"],
        .post-container input[type="number"],
        .post-container textarea,
        .post-container select {
            width: 100%;
            padding: 10px 12px;
            background: #1b1b1b;
            border: 1px solid #333;
            border-radius: 8px;
            color: #f0f0f0;
            font-size: 14px;
            transition: border 0.3s ease, box-shadow 0.3s ease;
        }

        /* فوکوس */
        .post-container input:focus,
        .post-container textarea:focus,
        .post-container select:focus {
            outline: none;
            border-color: #666;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.08);
        }

        /* textarea */
        .post-container textarea {
            resize: vertical;
            min-height: 120px;
        }

        /* دکمه ارسال */
        .post-container input[type="submit"] {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background: linear-gradient(90deg, #2a2a2a, #3a3a3a);
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
        }

        /* هاور دکمه */
        .post-container input[type="submit"]:hover {
            background: linear-gradient(90deg, #3a3a3a, #4a4a4a);
        }

        /* پیام خطا */
        .post-container .errorlist {
            margin: 6px 0 0;
            padding: 0;
            list-style: none;
            color: #ffffff;
            font-size: 13px;
        }

        .post-container .errorlist li {
            background: #2a2a2a;
            padding: 6px 10px;
            border-radius: 6px;
            margin-top: 6px;
        }

        /* help text */
        .post-container .helptext {
            font-size: 12px;
            color: #9a9a9a;
        }

        .form-errors {
            background-color: #1e1e1e;
            border: 1px solid #ff4d4d;
            border-radius: 16px;
            padding: 15px 20px;
            margin: 20px auto; /* وسط‌چین افقی */
            max-width: 600px; /* عرض منطقی */
            width: 100%;
            color: #fff;
            font-size: 14px;
        }


        .error-title {
            color: #ff4d4d;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .error-item {
            background-color: #2a2a2a;
            border-left: 4px solid #ff4d4d;
            padding: 8px 12px;
            margin-bottom: 6px;
            border-radius: 4px;
        }

        .error-field {
            color: #ffa07a;
            font-weight: bold;
            margin-right: 5px;
        }

        .error-message {
            color: #f5f5f5;
        }
    </style>
{% endblock %}
