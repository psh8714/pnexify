{% load static %}
<footer class="pnexify-footer">

    <div class="footer-glow"></div>
    <div class="footer-top">
        <div class="footer-brand">
            <div class="footer-logo">
                <img src="{% static 'images/pnexify.png' %}" alt="Pnexify">
            </div>
            <h2>Pnexify</h2>
            <p>
                Learn. Build. Connect.
            </p>
        </div>
        <div class="footer-links">
            <div>
                <h5>Platform</h5>
                <a href="{% url 'blog:post_list_category' 'WIC' %}">Projects</a>
                <a href="{% url 'blog:post_list_category' 'IHQ' %}">Questions</a>
                <a href="{% url 'blog:post_list_category' 'WIL' %}">Learn</a>
                <a href="{% url 'blog:post_list_category' 'SFT' %}">Find Team</a>
            </div>
            <div>
                <h5>Community</h5>
                <a href="https://t.me/pnexify">Telegram</a>
                <a href="https://github.com/">Github</a>
            </div>
            <div>
                <h5>Resources</h5>
                <a href="{% url 'blog:about_us' %}">About</a>
            </div>
        </div>
    </div>
    <div class="footer-divider"></div>
    <div class="footer-bottom">
        <span>
            © 2026 Pnexify.
        </span>
        <span>
            Crafted with new ideas and hope by parham shafaghati.
        </span>
        <div class="footer-social">
            <a href="https://github.com/psh8714" target="_blank"><i class="bi bi-github"></i></a>
            <a href="https://t.me/pnexify" target="_blank"><i class="bi bi-telegram"></i></a>
            <a href="https://instagram.com/pnexify" target="_blank"><i class="bi bi-instagram"></i></a>
        </div>
    </div>
</footer>

<head>
    <link rel="stylesheet" href="{% static 'icons/bootstrap-icons.css' %}">

    <style>

        .pnexify-footer {

            position: relative;
            overflow: hidden;
            margin-top: 120px;
            padding: 80px 60px 35px;
            background: rgba(255, 255, 255, .55);
            backdrop-filter: blur(30px);
            border-top: 1px solid rgba(255, 255, 255, .65);
        }

        .footer-glow {
            position: absolute;
            pointer-events: none;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, #8b5cf630 0%, transparent 70%);
            top: -350px;
            right: -250px;
            animation: footerFloat 8s ease-in-out infinite;
        }

        @keyframes footerFloat {
            50% {
                transform: translateY(40px) scale(1.08);
            }
        }

        .footer-top {
            display: flex;
            justify-content: space-between;
            gap: 80px;
            flex-wrap: wrap;
        }

        .footer-brand h2 {
            font-size: 42px;
            font-weight: 900;
            margin: 10px 0;
        }

        .footer-brand p {
            max-width: 320px;
            color: #a55cff;
        }

        .footer-logo {
            width: 75px;
            height: 75px;
            border-radius: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #6d5efc, #6bc9ff);
            box-shadow: 0 15px 35px rgba(100, 100, 255, .25);
        }

        .footer-logo img {
            width: 45px;
        }

        .footer-links {
            display: flex;
            gap: 70px;
            flex-wrap: wrap;
        }

        .footer-links h5 {
            font-weight: 800;
            margin-bottom: 18px;
        }

        .footer-links a {
            display: block;
            color: rgb(25, 134, 236);
            margin-bottom: 12px;
            text-decoration: none;
            transition: .25s;
        }

        .footer-links a:hover {
            color: #6d5efc;
            transform: translateX(5px);
        }

        .footer-divider {
            margin: 50px 0 25px;
            height: 1px;
            background: linear-gradient(90deg,
            transparent,
            rgba(0, 0, 0, .08),
            transparent);
        }

        .footer-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .footer-bottom span {
            color: #000000;
        }

        .footer-social {
            display: flex;
            gap: 16px;
        }

        .footer-social a {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: #475569;
            background: rgba(255, 255, 255, .7);
            transition: .3s;
        }

        .footer-social a:hover {
            transform: translateY(-7px) rotate(10deg);
            background: #6d5efc;
            color: white;
            box-shadow: 0 15px 35px rgba(109, 94, 252, .35);
        }

        @media (max-width: 768px) {
            .pnexify-footer {
                padding: 60px 25px 30px;
            }

            .footer-top {
                flex-direction: column;
                gap: 40px;
            }

            .footer-links {
                gap: 35px;
            }

            .footer-bottom {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
