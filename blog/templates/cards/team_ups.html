<article class="team-card">

    <div class="team-top">
        <span class="team-badge">
            🤝 Team Up
        </span>
        <span class="team-time">
            {{ post.created|timesince }}
        </span>
    </div>
    <h2 class="team-title">
        {{ post.title }}
    </h2>
    <p class="team-description">
        {{ post.description|truncatewords:20 }}
    </p>

    <div class="needed-skills">
        {% for technology in post.tags.all %}
            <span>{{ technology.name }}</span>
        {% endfor %}
    </div>
    <div class="team-footer">
        <span>
            👤 {{ post.author.username }}
        </span>
        <a href="{% url 'blog:post_detail' post.slug %}">
            درخواست همکاری →
        </a>
    </div>
</article>

<style>
    .team-card {

        background: #ffffff;
        border-radius: 24px;
        padding: 24px;
        border: 2px solid #22c55e33;
        box-shadow: 0 15px 40px rgba(0, 0, 0, .08);
        transition: .45s;
        position: relative;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.33);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
    }

    .team-card:hover {
        transform: translateY(-6px);
        border-color: #22c55e;
    }

    .team-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .team-badge {
        background: #dcfce7;
        color: #15803d;
        padding: 7px 15px;
        border-radius: 999px;
        font-weight: 700;
    }

    .team-title {
        direction: rtl;
        text-align: right;
        margin-top: 18px;
        font-size: 1.5rem;
        font-weight: 800;
    }

    .team-description {
        direction: rtl;
        text-align: right;
        color: #555;
        margin-top: 12px;
        line-height: 1.8;
    }

    .team-info {
        display: flex;
        gap: 16px;
        margin-top: 18px;
    }

    .needed-skills {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
    }

    .needed-skills span {
        background: #f0fdf4;
        color: #15803d;
        border-radius: 999px;
        padding: 7px 14px;
        font-weight: 600;
    }

    .team-footer {
        margin-top: 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .team-footer a {
        text-decoration: none;
        color: #15803d;
        font-weight: 700;
    }
</style>
