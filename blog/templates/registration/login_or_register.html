<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود / ثبت نام</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            min-height: 100vh;
        }
        .auth-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        .auth-header {
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            color: white;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }
        .btn-auth {
            border-radius: 12px;
            padding: 10px 18px;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card auth-card">
                <div class="auth-header text-center py-5">
                    <h3 class="mb-0">خوش آمدی</h3>
                    <p class="mb-0">برای ادامه وارد شو یا ثبت‌نام کن</p>
                </div>

                <div class="card-body p-5">
                    <div class="d-grid gap-2">
                        <a href="{% url 'blog:user_register' %}" class="btn btn-primary btn-auth">
                            ثبت نام
                        </a>
                        <a href="{% url 'blog:login' %}" class="btn btn-outline-primary btn-auth">
                            ورود
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
