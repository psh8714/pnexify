{% extends 'parent/base.html' %}

{% block title %}change password{% endblock %}

{% block content %}
    <h1>enter last password and new password:</h1>
    <p>write details carefully</p>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            {{ field.label_tag }}
            {{ field }}
            {{ field.errors }}
        {% endfor %}
        <input type="submit" value="login">
        <input type="reset" value="reset">
    </form>
{% endblock %}
